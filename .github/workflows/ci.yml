name: AXIS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-migrations:
    name: Validate migrations (naming + COMMIT)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4

      - name: validate-migrations.sh --all
        run: bash scripts/hooks/validate-migrations.sh --all

  lint-and-typecheck:
    name: Lint + TypeScript Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: ESLint (boundaries)
        run: npx eslint .

      - run: npx tsc --noEmit

      - name: Env validation
        run: npx tsx src/lib/env.ts
        env:
          NODE_ENV: development

  test:
    name: Tests (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - run: npx vitest run --exclude='e2e/**'

  build:
    name: Build (Next.js)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint-and-typecheck, test]
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      REDIS_URL: ""
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: "sk_test_placeholder"
      GOOGLE_CLIENT_ID: "ci-google-client-id-placeholder-12345"
      GOOGLE_CLIENT_SECRET: "ci-google-client-secret-placeholder-12345"
      DATABASE_URL: "postgresql://placeholder:placeholder@localhost:5432/placeholder"
      NEXT_PUBLIC_SUPABASE_URL: "https://placeholder.supabase.co"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "placeholder"
      DATABASE_PASSWORD: "ci-placeholder"
      AXIS_ENCRYPTION_KEY: "ci-encryption-key-placeholder-12345"
      CLERK_WEBHOOK_SECRET: "whsec_ci_placeholder_12345"
      GOOGLE_REDIRECT_URI: "https://ci.example.com/api/google/callback"
      RESEND_API_KEY: "re_ci_placeholder_12345"
      CRON_SECRET: "ci-cron-secret-placeholder-32-or-more-chars"
      INTERNAL_API_KEY: "ci-internal-api-placeholder-12345"
      HOTMART_HOTTOK: "ci-placeholder"
      FIREBASE_PRIVATE_KEY: "ci-firebase-private-key-placeholder-12345"
      FIREBASE_CLIENT_EMAIL: "ci-firebase@ci.example.com"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - run: npm run next:build

  smoke:
    name: Smoke (Postgres real + cron jobs SQL)
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: axis
          POSTGRES_PASSWORD: smoketest
          POSTGRES_DB: axis_tcc
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: axis
      PGPASSWORD: smoketest
      PGDATABASE: axis_tcc
      PGOPTIONS: "-c app.encryption_key=smoketest_key"
    steps:
      - uses: actions/checkout@v4
      - name: Apply baseline schema (HUB-09)
        run: psql -v ON_ERROR_STOP=1 -f scripts/migrations/000_shared_baseline.sql
      - name: Apply migration 067 (tenants.status, idempotente)
        run: psql -v ON_ERROR_STOP=1 -f scripts/migrations/067_shared_tenants_status.sql
      - name: Apply migration 068 (events RLS, idempotente)
        run: psql -v ON_ERROR_STOP=1 -f scripts/migrations/068_shared_events_rls_forced.sql
      - name: Apply smoke seed (apenas dados de teste)
        run: psql -v ON_ERROR_STOP=1 -f scripts/ci/smoke-seed.sql
      - name: Smoke cron jobs SQL ABA
        run: |
          psql -v ON_ERROR_STOP=1 -f scripts/jobs/check_expiration.sql
          psql -v ON_ERROR_STOP=1 -f scripts/jobs/expire_attestations.sql
          psql -v ON_ERROR_STOP=1 -f scripts/jobs/purge_geo.sql
